name: Desktop Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Gateway-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Universal
    runs-on: macos-latest
    env:
      # Ad-hoc signing prevents Apple Silicon downloads from being treated as
      # completely unsigned while still requiring no Apple Developer secret.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build universal macOS app and DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Gateway-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - windows
      - macos
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MCP-Gateway-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lah release-files

          if ! find release-files -maxdepth 1 -type f | grep -q .; then
            echo "No release installers were found."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing installer assets."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "MCP-Gateway $RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" release-files/* --clobber
